<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기사 프로젝트 노트</title>
<style>
  :root{--mint:#2EC4B6;--mint-soft:#E6F8F5;--teal:#0F766E;--coral:#D93A3F;--ink:#17212B;--sub:#46525F;--line:#DDE5EC}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
       color:var(--ink);background:#fff;line-height:1.6;-webkit-font-smoothing:antialiased}
  header{background:linear-gradient(180deg,var(--mint-soft),#fff);padding:40px 0 24px}
  .wrap{max-width:720px;margin:0 auto;padding:0 20px}
  .badge{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px}
  h1{font-size:clamp(26px,6vw,36px);font-weight:800;margin:14px 0 4px;letter-spacing:-.02em}
  header p{color:var(--sub);font-size:15px}
  section{padding:22px 0}
  h2{font-size:19px;font-weight:800;margin-bottom:12px}
  h2::before{content:"";display:inline-block;width:6px;height:18px;background:var(--coral);border-radius:3px;margin-right:10px;vertical-align:-3px}
  .card{border:1px solid var(--line);border-radius:16px;padding:16px;background:#fff}
  label.l{display:block;font-size:13px;font-weight:700;color:var(--teal);margin-bottom:4px}
  input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);border:1px solid var(--line);
       border-radius:12px;padding:12px 14px;background:#fff;min-height:48px}
  input[type=text]:focus,textarea:focus{outline:3px solid var(--mint);border-color:var(--mint)}
  textarea{resize:vertical;min-height:72px}
  .row{display:flex;gap:10px;margin-bottom:10px}
  .row>*{min-width:0}
  .row .name{flex:1 1 40%}.row .role{flex:1 1 60%}
  .angle{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--mint-soft);border-radius:12px;padding:12px 14px}
  .angle b{font-size:13px;color:var(--teal)}
  .angle span{font-weight:700}
  .todo{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .todo input[type=checkbox]{width:26px;height:26px;flex:none;accent-color:var(--teal)}
  .todo input[type=text]{flex:1}
  .todo.done input[type=text]{text-decoration:line-through;color:var(--sub)}
  .log{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
  .log .d{flex:none;width:64px;font-weight:800;color:#fff;background:var(--mint);color:var(--ink);border-radius:10px;text-align:center;padding:12px 0;font-size:15px}
  .btn{font:inherit;font-weight:700;font-size:15px;color:var(--ink);background:#fff;border:2px solid var(--ink);
       border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer}
  .btn:hover{background:var(--mint-soft)}
  .hint{font-size:12px;color:var(--sub);margin-top:8px}
  footer{padding:8px 0 40px;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <span class="badge">기사 프로젝트 노트</span>
    <h1>프로젝트 노트</h1>
    <p>칸을 눌러 바로 적으시면 이 기기에 자동 저장됩니다.</p>
  </div>
</header>

<main class="wrap">

  <section>
    <h2>프로젝트 한 줄</h2>
    <div class="card">
      <label class="l" for="brief">브리프 한 줄</label>
      <input type="text" id="brief" data-k="brief" placeholder="여기에 브리프를 적어 주세요">
    </div>
  </section>

  <section>
    <h2>팀 이름과 역할</h2>
    <div class="card">
      <label class="l" for="team">팀 이름</label>
      <input type="text" id="team" data-k="team" placeholder="팀 이름">
      <div style="height:14px"></div>
      <label class="l">팀원 · 역할</label>
      <div id="members"></div>
      <button class="btn" type="button" id="addMember">+ 팀원 추가</button>
    </div>
  </section>

  <section>
    <h2>주제</h2>
    <div class="card">
      <label class="l" for="topic">대주제</label>
      <input type="text" id="topic" data-k="topic" placeholder="배정받은 대주제">
      <div class="angle"><b>내 앵글</b><span>내일 정함</span></div>
    </div>
  </section>

  <section>
    <h2>할 일 체크리스트</h2>
    <div class="card" id="todos"></div>
  </section>

  <section>
    <h2>날짜별 기록</h2>
    <div class="card">
      <div id="logs"></div>
      <button class="btn" type="button" id="addLog">+ 다음 날 추가</button>
      <p class="hint">오늘(11/18)부터 한 줄씩 남겨 보세요.</p>
    </div>
  </section>

</main>

<footer>개인정보(전화번호·주소 등)는 적지 않는 노트입니다.</footer>

<script>
(function(){
  var KEY='article-project-note-v1';
  var S=load();
  function load(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
  function el(t,c){var e=document.createElement(t);if(c)e.className=c;return e}

  // 단일 칸
  [].forEach.call(document.querySelectorAll('[data-k]'),function(i){
    i.value=S[i.dataset.k]||'';
    i.addEventListener('input',function(){S[i.dataset.k]=i.value;save()});
  });

  // 팀원
  S.members=S.members||[{n:'',r:''},{n:'',r:''}];
  var mw=document.getElementById('members');
  function renderMembers(){
    mw.innerHTML='';
    S.members.forEach(function(m,idx){
      var r=el('div','row');
      var n=el('input');n.type='text';n.placeholder='이름';n.className='name';n.value=m.n;n.setAttribute('aria-label','팀원 '+(idx+1)+' 이름');
      var o=el('input');o.type='text';o.placeholder='역할';o.className='role';o.value=m.r;o.setAttribute('aria-label','팀원 '+(idx+1)+' 역할');
      n.oninput=function(){m.n=n.value;save()};o.oninput=function(){m.r=o.value;save()};
      r.appendChild(n);r.appendChild(o);mw.appendChild(r);
    });
  }
  document.getElementById('addMember').onclick=function(){S.members.push({n:'',r:''});save();renderMembers()};
  renderMembers();

  // 체크리스트 5개
  S.todos=S.todos||[1,2,3,4,5].map(function(){return {t:'',c:false}});
  var tw=document.getElementById('todos');
  S.todos.forEach(function(it,idx){
    var r=el('div','todo'+(it.c?' done':''));
    var c=el('input');c.type='checkbox';c.checked=it.c;c.setAttribute('aria-label','할 일 '+(idx+1)+' 완료');
    var t=el('input');t.type='text';t.placeholder='할 일 '+(idx+1);t.value=it.t;
    c.onchange=function(){it.c=c.checked;r.className='todo'+(c.checked?' done':'');save()};
    t.oninput=function(){it.t=t.value;save()};
    r.appendChild(c);r.appendChild(t);tw.appendChild(r);
  });

  // 날짜별 기록 (11/18부터)
  S.logs=S.logs||[{d:'11/18',t:''}];
  var lw=document.getElementById('logs');
  function renderLogs(){
    lw.innerHTML='';
    S.logs.forEach(function(g,idx){
      var r=el('div','log');
      var d=el('div','d');d.textContent=g.d;
      var t=el('input');t.type='text';t.value=g.t;t.placeholder=idx===0?'오늘 한 줄':'이날 한 줄';t.setAttribute('aria-label',g.d+' 기록');
      t.oninput=function(){g.t=t.value;save()};
      r.appendChild(d);r.appendChild(t);lw.appendChild(r);
    });
  }
  document.getElementById('addLog').onclick=function(){
    var last=S.logs[S.logs.length-1].d.split('/');
    var dt=new Date(2026,parseInt(last[0],10)-1,parseInt(last[1],10)+1);
    S.logs.push({d:(dt.getMonth()+1)+'/'+dt.getDate(),t:''});save();renderLogs();
  };
  renderLogs();
})();
</script>
</body>
</html>
